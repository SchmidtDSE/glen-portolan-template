<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St. Louis open data</title>

    <!-- Placeholder mark until GLEN has one — see app/assets/README.md.
         Downstream apps should point this at their own icon. -->
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/SchmidtDSE/glen@v4.6.0/app/assets/favicon.svg">

    <!-- glen core adds MapLibre, PMTiles, marked, DOMPurify, highlight.js and
         its own stylesheets itself. Every cdn.jsdelivr.net/gh/SchmidtDSE/glen@
         URL (the favicon here, the module script at the end, and the MCP and
         downloads plugins in layers-input.json) must name the same ref; bump
         them together. -->
    <style>
        /* Boot placeholder — see #boot-status in the body. */
        #boot-status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font: 14px/1.4 system-ui, sans-serif;
            color: #666;
            text-align: center;
        }
        #map.maplibregl-map #boot-status { display: none; }
    </style>
</head>

<body>
    <!-- Map -->
    <!-- #boot-status makes a failed module load read as "stuck loading" rather
         than an unexplained blank page. MapLibre puts .maplibregl-map on this
         container once the map exists, which hides it again — no JS needed (#343). -->
    <div id="map">
        <div id="boot-status">Loading map modules…</div>
    </div>

    <!-- Layer controls — generated by MapManager.generateMenu() -->
    <div id="menu"></div>

    <!-- App bootstrap -->
    <script type="module" src="https://cdn.jsdelivr.net/gh/SchmidtDSE/glen@v4.6.0/core/main.js"></script>
</body>

</html>
